conventions:
  - id: C1
    title: M1 activation gate
    ruling: >
      M1 activates at EXACTLY 10 logged picks, counted per mode
      (M1_ACTIVATION_N = 10). Override picks COUNT toward the gate and are
      included in M1 training data: an override is the strongest
      revealed-policy signal there is, and M1 is the model of the judge's
      revealed policy, not of the tool's verdicts. Excluding overrides would
      train M1 to agree with M0 — circular. (Answers Architecture's open
      question (a); matches Engineering's shipped code, whose
      DecisionLog.training_data uses every pick unfiltered, and Compliance's
      n>=10 test.)
    trace: "spec §3 'M1 active ≥ ~10 decisions'; Spine metric 3 'model-of-the-judge activates from the user's own log by roughly decision 10'"

  - id: C2
    title: Too-close band — no wider dead-band
    ruling: >
      "Too close to call" triggers exactly when the bootstrap interval
      straddles 50%, boundary touching included (an endpoint exactly at 0.5
      counts as straddling, breaking toward too_close, per Compliance
      T-VERDICT). No wider fixed dead-band is wanted: the interval already
      widens with genuine uncertainty, so a second margin would double-count
      it, and the Spine fixes the trigger verbatim. (Answers Architecture's
      open question (b).)
    trace: "Spine metric 4: '\"too close to call\" when the interval straddles 50%'; spec §4"

  - id: C3
    title: Risk-surface entry direction
    ruling: >
      Risk surface is ENTERED already reversed on 0–4 (4 = lowest exposure),
      sign +1, exactly as Engineering shipped in configs/one_to_n.yaml — one
      scale direction for every 0–4 factor (higher = better for the idea), no
      hidden 4−x flip inside the engine. UI copy and all demo material must
      state the direction explicitly ("4 = lowest exposure"). GTM's
      seed-comparison.json currently narrates the opposite convention (user
      enters exposure, engine reverses); its SCORED values (A 1.0, B 1.5)
      already match this ruling — only its entry-direction narration needs
      aligning.
    trace: "spec §2 1→N table: 'hallucination/compliance exposure, 0–4 reversed'"

  - id: C4
    title: Canonical seed z-scoring distributions
    ruling: >
      The seed distributions (means/stds, stated in transform space) as
      shipped in configs/one_to_n.yaml and configs/zero_to_one.yaml are THE
      canonical z-basis. Any demo, tour, sample log, or test that derives
      displayed probabilities must use these exact values or reproduce
      different numbers knowingly and say so. Exchange-round verification:
      Engineering aligned the 1→N config to GTM's canonical demo
      (leaves/gtm/seed-comparison.json) — Reach ships transform: identity with
      μ5000/σ3000 and Effort σ4, matching the tour's numbers, so the tour's
      p=59% / CI 52–64% reproduces inside the shipped app. The log10p
      (log10(1+x)) transform remains implemented in pairwisepm/config.py as an
      opt-in for heavy-tailed user bases, per the config's own rationale note;
      switching Reach to it is a config edit that changes displayed numbers
      and re-triggers GTM/Compliance recomputation exactly as a D1 resolution
      would. The only remaining GTM divergence is the risk-surface
      entry-direction narration, covered by C3.
    trace: "spec §2 'seed distributions ship in config until the log grows'; weights-as-config hinge (Sequencing)"

  - id: C5
    title: Interval confidence level
    ruling: >
      The interval is a 90% percentile bootstrap over per-factor
      contributions, as shipped. The 90% level is ratified as the default and
      must live as a config/engine constant (it already is: level=0.90 in
      pairwisepm/engine.py), not a magic number in UI copy — Design's
      str.verdict.prob_gloss says "90% bootstrap interval", so a level change
      is a paired config+copy change. No queue entry needed: no stakeholder
      proposes a different level. (Answers Design's flag.)
    trace: "spec §4 'bootstrap over factors → interval on the win probability'; Spine metric 4 'intervals shown always'"

  - id: C6
    title: Leverage-panel weight handoff at M1 activation
    ruling: >
      The leverage panel hard-switches from prior (M0) weights to M1 weights
      at activation, with the regime label MANDATORY on the panel ("computed
      from your stated priors" vs "computed from your revealed weights") — no
      blend. Rationale: unlike the z-basis (D5), the weight regimes are
      user-facing named policies whose difference the product deliberately
      surfaces (revealed-vs-stated table); blending them would manufacture a
      third policy nobody stated. The label converts the discontinuity from
      silent noise into an explained regime change. (Answers Architecture's
      open question (c) — no decision entry needed.)
    trace: "spec §3 'M1 vs. M0 weight divergence displayed as what your revealed policy weighs vs. what you say you weigh'"

  - id: C7
    title: Fresh-load default mode (D-design-1 ratified)
    ruling: >
      Fresh load defaults to 1→N mode, so 0→1 — and its permanent
      no-accuracy banner — is always an explicitly chosen context. Uncontested
      across leaves; ratified as Design wrote it.
    trace: "Spine metric 4 / spec §1: 0→1 permanent structure-not-prediction banner"

  - id: C8
    title: Override honored, never fought (D-design-2 ratified)
    ruling: >
      Picking against a computed verdict or a too-close-to-call is always
      allowed and requires exactly one logged one-sentence rationale before
      append — no extra friction, no nag. The record carries pick, both model
      outputs, and the rationale verbatim; override picks still train M1 (C1).
      Uncontested; ratified as Design wrote it.
    trace: "Spine Solution Direction: the judge 'applies the PM's own policy' — it does not replace it; spec §6 override rationale field"
