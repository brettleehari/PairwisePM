      different product. Deciding this now costs one paragraph; deciding it at
      the hour costs a sitting, and would be decided by whoever spoke first —
      which is the harm this entry exists against, arriving through this
      entry's own instrument.
      RESIDUE, NAMED RATHER THAN SWALLOWED — and deliberately NOT re-queued,
      because neither item is a disagreement and this queue does not carry
      recording gaps as if they were. (a) sequencing's files do not yet name
      P-14, though sequencing accepted it on the round-15 record ("a
      precondition of the sitting, not a new node and not a blocker"); the
