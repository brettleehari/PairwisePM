      ROUND-17 · A GAP IN THIS LEAF'S OWN RULING, FOUND BY READING SEQUENCING'S
      FILE RATHER THAN BY BEING TOLD, AND CLOSED HERE RATHER THAN QUEUED. The
      ruled PREDICATE is about which copy was served — "a bound module that is
