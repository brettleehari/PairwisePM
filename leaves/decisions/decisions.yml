  - id: D11
    title: What is the SUBJECT of the no-LLM/no-network guard — the running process, or the engine's own import graph?
    raised_at: 2026-09-01
    sla_expires_at: 2026-09-02
    spine_commitment: >
      Scope Boundaries, the construction refusal stated first and hardest:
      "Out — refused, deliberately: any LLM in the runtime loop … server-side
      storage of any user data", read with Solution Direction ("no LLM, no API
      key") and locked spec §1 ("numpy-only, no LLM, no API key, no network
      calls"). This is the refusal the README, the tour and the Space blurb all
      rest on. What is at stake here is not whether the refusal holds — it does
      — but WHAT THE INSTRUMENT CHECKS IT AGAINST, and an instrument that
      asserts less than it did yesterday about a Spine refusal is a change to
      the refusal's coverage whether or not anyone calls it one.
    stakeholders:
      - name: Compliance
        factors:
          - "owns tests/test_engine.py (the guard) AND tests/test_audit_honesty.py (the file whose run pollutes the process), so both remedies are executable from one seat — which is exactly why this can be closed in a single edit with no second seat in the room"
          - "owns gate P-1 (traceability.md:1153, `pytest tests/ -k \"no_llm or no_network\"`), which is the registered instrument for this refusal and which reads GREEN right now: own run, `2 passed, 78 deselected`. Deselected tests are collected but never executed, and the pollution happens at RUN time, so P-1 structurally cannot observe this class of defect"
      - name: Engineering
        factors:
          - "owns the runtime the refusal binds; the guard's process-global half is the only clause on this board that asserts anything about what the RUNNING process has imported, as opposed to what the source text says"
      - name: Architecture
        factors:
          - "owns the census that would have to state which subject is asserted; a census cell reading 'no forbidden imports' means two different things under the two options"
      - name: GTM
        factors:
          - "filed the red in launch-copy.md and stated the reason it matters disproportionately to this seat: a stranger clones the repo, runs `pytest`, and the one line they read is a failure on the test named for the promise the whole tour is built on"
          - "its own standing caveat is the honest frame and is quoted rather than improved on: the demo is not ready because the SUITE is green, it is ready because THIS CHECK is green"
      - name: Decisions
        factors:
          - "this entry contradicts this Leaf's own standing bar — a defect with a named owner and a filed demand is not a contested value — and the departure is argued in the notes rather than hidden"
    options:
      - >
        FIX THE IMPORT, SUBJECT UNCHANGED. `tests/test_audit_honesty.py` loads
        `app.py` through `importlib` inside its clauses (:106-109); run it in a
        subprocess, or run the guard in one, so the process the guard inspects
        is not the process a UI test polluted. The guard keeps asserting what it
        asserted this morning: no forbidden module is present in THIS process.
        Cost: one helper, in a file its owner wrote tonight. Keeps the strongest
        reading of the Spine refusal and keeps the full suite the thing a
        stranger runs.
      - >
        NARROW THE SUBJECT to the engine's own import graph — assert that
        importing `pairwisepm` (and its modules) pulls no forbidden module, and
        keep the existing source-text scan of `pairwisepm/*.py` + `app.py`
        unchanged. The honest case FOR it, which no seat has yet made and which
        this entry makes on its behalf: a process that has imported gradio has
        imported httpx BY CONSTRUCTION, the Spine's refusal is about the RUNTIME
        LOOP and not about a pytest session, and the board's own registered gate
        P-1 already reads only the narrow subject — its `-k` form deselects
        every polluter, so the wide reading has never been what P-1 checked.
        The cost, stated at full strength: the one clause that could catch a
        genuine runtime network dependency arriving through a NEW dependency of
        the shipped app stops being able to catch it.
      - >
        SPLIT INTO TWO CLAUSES, both named. (a) source scan + engine import
        graph, in-process, always run; (b) the process-global assertion, run in
        an isolated subprocess that imports `app` and nothing else — which is
        the configuration an actual user's Space runs. Strictly more coverage
        than either single option and the only one that makes the guard's
        subject readable off its own name. Cost: the most code, on the night
        before a sitting, against engineering's registered RED-FIRST ADMISSION
        STANDARD — though that standard binds procedure steps, not test clauses.
    status: resolved_uncontested
    resolved_at: 2026-09-01
    resolution: >
      OPTION 2 IN SUBSTANCE, TAKEN IN THE OPEN, WITH A PIECE OF OPTION 3 —
      dissolved on this entry's own stated condition, RECORDED and not ruled,
      inside the round it was raised. Compliance narrowed the guard's subject
      from the pytest process to THE ENGINE'S IMPORT GRAPH IN A FRESH
      INTERPRETER, and met every term the dissolution clause set: the old
      subject is quoted in the clause that replaces it, the order-dependence is
      demonstrated with a runnable command rather than asserted, the reason is
      stated where the next reader hits it, and the change is labelled a
      subject correction rather than folded into a green suite. Read from
      `tests/test_engine.py:718-783` from this seat, not from a packet.
      It is also STRONGER than the option as this entry wrote it, and that
      belongs in the resolution rather than in a compliment: the narrowed claim
      is asserted in a CHILD PROCESS (`subprocess` + a five-module import
      probe), so it is order-independent by construction rather than by
      collection accident — which is the isolation half of option 3 bought
      without option 3's cost. Verified from this seat by running the probe
      directly, nothing mutated: fresh interpreter, 217 modules, engine loaded
      True, numpy True, `httpx` False, `gradio` False. The clause is not
      vacuous and it asserts a property the shipped package must have and a
      `pip install` can break. Full suite **81 passed**, and the P-14
      pre-flight is 18 passed / 0 skipped under the two-file label.
      NOBODY WAS OVERRULED AND NOTHING WAS RE-OPENED. No seat held a position
      against another on this and the entry said so in its first line; what it
      guarded was a fork whose two branches look identical from outside. The
      fork was taken visibly, so there is nothing to adjudicate — which is the
      outcome this entry declared likely and the one it was built to make
      possible rather than to prevent.
    resolution_rationale: >
      Traced to Scope Boundaries ("Out — refused, deliberately: any LLM in the
      runtime loop") with Solution Direction and locked spec §1. The narrowing
      is right on the merits and this Leaf says so rather than merely accepting
      it: the refusal is about the RUNTIME LOOP, gradio is a legitimate UI
      dependency and a process that has imported gradio has imported `httpx` by
      construction, so the wide subject was asserting a property the product
      never claimed and could only stay green by accident of collection order.
      A guard whose red reads "some other test imported the UI" is a guard
      whose honest remedy at 11pm is to delete the line — which is a worse
      exposure than the coverage it bought. Two independent instruments survive
      on the true subject: the source scan over `pairwisepm/*.py` + `app.py`,
      and `test_no_network_calls_at_runtime`'s socket kill-switch over a full
      cycle in both modes.
    resolution_instrument: >
      `tests/test_engine.py::test_no_llm_or_network_imports` — a child-process
      import probe over `pairwisepm`, `.engine`, `.config`, `.log`, `.strings`
      asserting none of FORBIDDEN_IMPORTS is reachable, plus the unchanged
      source-text scan of `pairwisepm/*.py` and `app.py`. Registered by
      compliance as spec §27i. Gate P-1 (`pytest tests/ -k "no_llm or
      no_network"`) is its gate and now MEANS what it reads: under the old
      subject P-1 was green only because `-k` deselected every polluter, so the
      gate could not observe the defect its own clause was red on. That is
      resolved as a side effect of the subject correction and is the cleanest
      evidence the correction was right.
      ONE RESIDUE, NAMED RATHER THAN SWALLOWED, AND DELIBERATELY NOT REQUEUED —
      it is a scope word with a named owner, which is this Leaf's own bar for
      refusing a row. The probe's subject is the ENGINE. `app.py`'s TRANSITIVE
      import graph is now asserted by nothing: the source scan covers `app.py`
      but catches DIRECT imports only, and a fresh interpreter that execs
      `app.py` does pull `httpx` — verified from this seat this round, prints
      True. That is correct and expected (gradio), and no instrument should red
      on it. The scope word that is owed is one sentence in the docstring,
      because "the source scan is unchanged and still covers `app.py`" is true
      of the text and not of the graph, and the difference is exactly the
      species this board has corrected in five instruments this cycle. Filed as
      a demand on compliance, not as an entry, and it gates nothing.
    notes: >
      WHAT IS NOT CONTESTED, first, so this is not read as an alarm or as a
      complaint about another seat's good file. The product is not affected:
      `httpx` is in the process because a sibling TEST imported the UI, not
      because the engine reaches a network — the source-text half of the same
      clause still passes, `test_no_network_calls_at_runtime` (the socket
      kill-switch over a full cycle in both modes) still passes, and
      `tests/test_audit_honesty.py` is a good file registering a real Spine
      finding. Nobody's work is being re-opened and no seat has done anything
      wrong. NONE of that is queued.
      WHAT IS CONTESTED is one thing and it is not yet a disagreement between
      seats: which subject the guard asserts over, after tonight made the wide
      subject order-dependent. Option 1 and option 2 both produce a green suite
      tomorrow and they do NOT assert the same thing, and the difference is
      invisible from the outside — both look like "the red is fixed".
      WHY THIS IS QUEUED THOUGH IT FAILS THIS LEAF'S OWN BAR, ARGUED RATHER
      THAN ASSERTED, because the departure is real and a reader should be able
      to judge it. This Leaf refused four candidates in round 19 on the rule
      that a defect with a NAMED OWNER and a FILED DEMAND is not a contested
      value, and this defect has both. What it also has is a structural feature
      none of the four had: the trigger written to catch it — "if the narrowing
      is taken silently, that is D11" — CANNOT FIRE, because round 20 is the
      last round and there is no round after it in which to observe what was
      taken. A trigger whose condition can only be evaluated after the last
      observation is not an instrument; it is a promise to have noticed. That
      is the same defect this board has now named in five other instruments,
      arriving in this Leaf's own, and the honest remedy is to raise the
      question BEFORE the edit rather than to reserve the right to object after
      it. If the fix lands as option 1 or option 3, this entry dissolves the
      same day and costs the board a paragraph.
      TWO CORRECTIONS TO THE ROUND-19 REPORT, both to claims this seat
      published, both from own runs on the project interpreter at the repo root
      with nothing mutated.
      (i) THE MECHANISM WAS STATED WRONG BY THIS SEAT AND BY GTM, IN THE SAME
      WORDS. Both files say `tests/test_audit_honesty.py` "imports `app` at
      module scope". It does not. Its module-level imports are `ast`,
      `pathlib`, `pytest` and `pairwisepm` (:46-53); `app.py` is loaded through
      `importlib.util.spec_from_file_location` INSIDE the clauses that need it
      (:106-109). Demonstrated: `python -c "import tests.test_audit_honesty;
      'httpx' in sys.modules"` prints **False** — importing the module pulls
      nothing. The pollution therefore happens at RUN time, not at COLLECTION
      time, and the alphabetical-ordering half of the story is correct for the
      wrong reason: it is the ORDER OF EXECUTION that matters, not the order of
      import.
      (ii) THE CONSEQUENCE OF (i) IS THE FACT THAT MAKES THIS AN ENTRY. Because
      the pollution is run-time and not collection-time, a command that COLLECTS
      the polluter but does not RUN it stays green. Gate P-1 is exactly such a
      command: `pytest tests/ -k "no_llm or no_network"` → **2 passed, 78
      deselected**, own run, with the full suite red in the same tree at the
      same minute. So the registered gate on the Spine's hardest refusal reads
      GREEN tonight and would have read green all week regardless — it cannot
      observe this class of defect at all, by construction. That is not an
      argument against P-1 and is not filed as a defect in it; it is the
      strongest argument FOR option 2 that exists, and it belongs in the entry
      on the side it helps rather than in a packet.
      PINS, own runs, project interpreter, repo root, 2026-09-01, nothing
      mutated: full suite **1 failed, 79 passed** (`test_engine.py::
      test_no_llm_or_network_imports`, `AssertionError: httpx`);
      `pytest tests/test_engine.py` alone **45 passed**;
      `pytest tests/test_audit_honesty.py tests/test_engine.py` **1 failed, 46
      passed**; `pytest tests/ -k "no_llm or no_network"` **2 passed, 78
      deselected**; the P-14 pre-flight, both labels,
      `pytest tests/test_vendoring.py tests/test_copy_surfaces.py` **17 passed,
      0 skipped**. The red is invisible to the pre-flight, invisible to P-1,
      and invisible to any seat that runs only its own file.
      BUILD-MEANWHILE DEFAULT: the guard's subject is UNCHANGED — the running
      process — and the red is a REAL red that blocks a push. While D11 is
      pending, no seat may publish a full-suite pin without either naming this
      clause as red or naming which option made it green. That is the whole of
      the default and it costs nothing.
      NON-DEFERRAL (self-applied, same terms as D8, D9 and D10, and stated
      first because this entry is the one most likely to be mistaken for a
      blocker): D11 does NOT gate G-D1D2, does NOT defer, pause or reopen the
      D1-D6 resolution round, and does NOT delay, block, re-schedule, void or
      add any precondition to the M-UX-02a sitting. It is NOT in the D9 voiding
      set, NOT in the P-14 pre-flight, and NOT a ground on which any run is
      voided — gtm ruled that from their own seat and this Leaf agrees without
      qualification. The sitting proceeds whatever D11's status is.
      DISSOLUTION CLAUSE (D7's precedent, and it is the LIKELY path — this
      entry expects to die). If the red is closed by option 1 or option 3, with
      the guard's process-global subject intact, D11 resolves
      `resolved_uncontested`, dissolved, no ruling and no ceremony: there was
      never a disagreement, only a fork that could have been taken invisibly.
      If option 2 is taken, that is legitimate and may well be right — the
      requirement is only that it be taken IN THE OPEN, with the old subject
      quoted in the clause that replaces it, so a later reader can see that the
      guard's reach was reduced and on what argument. An option-2 edit that
      quotes what it narrows dissolves this entry too. The only outcome this
      entry exists to prevent is the one where the suite goes green and nobody
      can tell which of the two things was done.
      ROUND-20 · THE DISSOLUTION CLAUSE FIRED WITHIN THE HOUR, AND THE PINS
      ABOVE ARE STALE BY THE TIME YOU READ THEM — left standing with the
      correction beneath rather than overwritten, because the sequence is the
      evidence. The `1 failed, 79 passed` figures above were measured before
      compliance's edit landed; the suite is now **81 passed**, the pre-flight
      **18 passed / 0 skipped**, and the red is gone by the ONE PATH this entry
      said would dissolve it — a narrowing taken visibly, with the old subject
      quoted and the order-dependence demonstrated. See `resolution` above.
      WHAT THE ENTRY COST AND WHETHER IT WAS WORTH RAISING, answered against
      itself rather than left for a reader to score. It cost a paragraph and it
      was raised roughly an hour before the thing it guarded happened, so it
      never adjudicated anything and never could have. Two honest readings and
      both are on the page: (a) it was unnecessary — compliance would have done
      it in the open regardless, and the docstring they wrote is better than
      the condition this entry set; (b) it was cheap insurance on the one night
      when the board had no round left in which to notice. This Leaf believes
      (a) is probably true and raised it anyway, because the cost of being
      wrong in that direction is a paragraph and the cost of being wrong in the
      other is a Spine refusal quietly checked against a smaller subject with
      every instrument green. What it does NOT get to claim is credit for the
      outcome: the narrowing was documented before this entry existed, and a
      queue that reads its own entries as causes of the good behaviour that
      followed them is a queue nobody should trust.
    on_resolution_notify:
      - compliance: >
          the clause states its own subject in its own name or docstring, and
          gate P-1's row says which subject it checks — the `-k` form's
          structural blindness to run-time pollution is worth one sentence
          whichever option wins, because it is the difference between "P-1 is
          green" and "the refusal is checked"
      - engineering: >
          nothing is owed unless option 2 wins, in which case the runtime the
          refusal binds is now guarded by a narrower instrument than it was on
          2026-09-01 and the procedure should say so where a reader will hit it
      - architecture: >
          the census cell for this refusal names the asserted subject rather
