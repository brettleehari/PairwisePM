      and the green suite is NOT citable as evidence that no-imputation
      blocking works in the served UI (R-8) — status claims citing delta (d)
      as closed are suspended until the fix lands.
    on_resolution_notify:
      - engineering: "fix per the winning option; mechanism engineering's call, acceptance behavioral"
      - sequencing: "admit or refuse the node per the resolution; a gating resolution parallels G-D1D2 at zero elapsed-time cost"
      - compliance: "regression guard required at the serialization level (gradio-client or schema-level check that an untouched Number field does not submit 0) — the existing suite cannot red on this class"
      - design: "re-run M-UX-01/M-UX-03 checks in one session once fixes land (states.md §6.5); flip R-5's downstream note"
