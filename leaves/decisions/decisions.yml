# Decisions Leaf — PairwisePM
# Per Spine and Leaf §5.9: 2-day SLA, then AI adjudication with full Spine/Leaf
# context; 24-hour human override window after an AI resolution.
#
# RESOLVER'S OBLIGATION (accepted round 8, compliance's demand — binding on
# Hari and adjudicator alike): every resolution recorded on D1–D6 carries a
# per-entry `resolution_source: hari | ai_adjudication` field alongside
# `resolved_at`. Mixed outcomes are expected (Hari may resolve some entries
# before the 2026-09-01 expiry and adjudication the rest), so the source is
# named PER ENTRY, never per batch. Reason: compliance's regeneration duty
# (T-M0-01/T-PAR pinned constants, every T-FRAG fixture) writes a provenance
# line on each regenerated constant citing who resolved the value it pins —
# a fixture whose provenance cannot name its resolver is an untraceable
# constant, which the traceability matrix exists to forbid. A resolution
# record lacking this field does not lift G-D1D2.
#
# EXECUTION ORDERING (accepted round 12 from sequencing, boundary stated
# round 13 — binding on tomorrow's resolver): at the 2026-09-01 expiry the
# adjudication of whatever D1-D6 entries remain pending executes SAME DAY.
# Exactly ONE event defers it: if the M-UX-02 witnessed sitting is convening
# in the FIRST HOUR of 2026-09-01, the resolution round runs after that
# sitting ends (zero SLA cost — the obligation is same-day, not first-hour).
# Nothing else defers it. A sitting arriving later in the day, an unconvened
# window, or any other pending human event does NOT pause, delay, or reopen
# the resolution round; entries stay adjudicated on their own clock, with
# Hari's own resolutions recorded `resolution_source: hari` per entry and the
# adjudicated remainder overridable through 2026-09-02.
#
# RESOLUTION-ROUND HAZARD — VERIFIED FROM THIS SEAT, DELIBERATELY NOT QUEUED
# (round 17, 2026-08-31). D1 and D2 resolve INTO configs/*.yaml, and this
# machine carries a SECOND copy of those two files, at
# `.venv/lib/python3.11/site-packages/configs/`. Checked here rather than taken
# from a packet: the install is EDITABLE — its dist-info `direct_url.json` reads
# `{"dir_info": {"editable": true}, "url": "file:///Users/brettleehary/mcparea/ProMgtAI"}`
# — and that same dist-info's RECORD lists both YAML files
# (`configs/one_to_n.yaml,sha256=RL_7s3pRSc-…,3894`;
# `configs/zero_to_one.yaml,sha256=ALjXJGEI5gzIuZthbIbfhVKmpQ6nKf4y-uBFj0B_aRQ,4149`),
# digests this seat recomputed against the repo's own `configs/` this round —
# identical, both files. The duplicate is therefore NOT an artifact of some
# other, hypothetical non-editable install: it exists right now, under the
# install this repo has today, created by the wheel force-include
# (`[tool.hatch.build.targets.wheel.force-include] "configs" = "configs"`) that
# the editable target inherits. The moment resolved values land in the repo's
# configs/*.yaml, that second copy holds the OLD policy.
#
# Three consequences, written HERE because the round is this Leaf's:
#  (1) The round-3 compliance covenant above guards the PINNED CONSTANTS
#      (T-CFG-01/T-M0-01/T-PAR/T-FRAG). A stale second copy of the VALUES is a
#      different object, which no fixture regeneration touches — it sits inside
#      that covenant's blind spot, which is why the resolver should not meet it
#      first in another seat's file.
#  (2) `pytest tests/test_vendoring.py` is EXPECTED TO RED on T-VEND-06 on the
#      next suite run after the write, with no reinstall involved. That red is
#      the guard working, not a broken environment. Baseline pinned from this
#      seat BEFORE any write: `.venv/bin/python -m pytest tests/test_vendoring.py`
#      → 7 passed, 0.03s, 0 skipped — T-VEND-06 RUNS here and passes, because
#      both copies are currently byte-identical. Full suite 73 passed, 1.53s.
#      Pin caveat this seat earned the hard way inside this round: an earlier
#      run of mine used the SYSTEM python3, which has no gradio and silently
#      skipped seven packaging clauses (66 passed, 7 skipped) — the pinned
#      numbers on this board are venv-interpreter numbers, and a suite count
#      reported without the interpreter that produced it is not a pin.
#      ROUND-18 RE-PIN, ADDED RATHER THAN OVERWRITTEN because the number
#      moved under this seat inside one round and that is the fact worth
#      keeping: `tests/test_vendoring.py` still reads 7 passed, 0 skipped
#      (the pre-write baseline above is UNCHANGED and is the one the
#      resolution round is measured against), while the FULL suite read 73
#      passed at the start of this round and 78 passed at its end — five
#      clauses landed from other seats while this Leaf edited two markdown
#      and YAML files and no test. Sequence of record on this board:
#      59 → 60 → 64 → 65 → 67 → 72 → 73 → 78. What the resolution round
#      needs from this line is the vendoring file's 7/0, not the suite
#      integer; a suite count is evidence of an hour, not a property.


#  (3) The remedy is refresh-or-remove — re-run `pip install -e .`, or
#      `pip uninstall pairwisepm` — NEVER a hand-edit of the site-packages copy,
#      and never deleting the force-include to make the red go away: that clause
#      is the only reason `pip install pairwisepm` finds its schemas at all, so
#      deleting it trades a red test for a broken install path.
#
# WHY THIS IS RECORDED AND NOT QUEUED, on this Leaf's own standing rule: it is a
# verified FACT with a named owner (compliance, for the F-31/T-VEND-06 docstring
# wording, which currently says "any NON-editable install") and a demand already
# filed against that owner by architecture. Defects with owners and filed demands
# are not queue entries here; queueing this one would be the trivia half of this
# Leaf's job to refuse. It is noted on the resolution round because the round is
# ours, not because the fact is contested.

decisions:
  - id: D1
    title: Prior weight magnitudes for the 1→N factor table
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "Solution Direction — mechanical judge applies a stated, editable policy"
    stakeholders:
      - name: Hari (PM)
        factors: [domain judgment on GenAI allocation decisions, lived decision history]
      - name: Build
        factors: [literature-defensible rankings, flat-maximum insensitivity to decimals]
    options:
      - proposed defaults (Impact .25, Feasibility .20, Reach .15, Unit econ .15, Flywheel .10, Risk .05, Effort −.10)
      - PM-revised magnitudes (rankings preserved)
      - PM-revised rankings
    status: pending
    notes: >
      Build proceeds on the proposed defaults; weights are config, not code.
      Flat-maximum argument: rankings matter far more than decimals.
      Defaults are wired in configs/one_to_n.yaml (Engineering) — sign-off edits
      land in that YAML file only, never in code.
    on_resolution_notify:
      - engineering: "edit configs/one_to_n.yaml only"
      - compliance: >
          regenerate pinned test constants T-M0-01 (L=0.26,
          p=0.5646362918030292), T-PAR-01 (z-shifts 1.04 / 2.66186), and all
          T-FRAG fixtures. Covenant (accepted round 3, same terms as gtm's): if
          any value changes from the shipped defaults, this flag is issued IN
          THE SAME ROUND as the resolution — written into the resolution note
          itself — and fixtures must regenerate before any push on the new
          values, else green tests silently test the wrong policy.
      - gtm: >
          recompute tour.html and seed-comparison.json displayed numbers
          (weights, L=0.345, p=59%, CI 52–64%, contributions, parity paths,
          too-close variant). Covenant (accepted round 2): if any prior weight
          changes from the shipped defaults, this notification is issued IN THE
          SAME ROUND as the resolution — written into the resolution note
          itself, which is possible by construction because decisions.yml
          status fields are what gate G-D1D2 — so sequencing cannot lift
          G-D1D2 on a resolution whose note lacks it.
      - sequencing: "do not lift G-D1D2 on a weight-changing resolution until the gtm recompute notification above appears in the resolution note"

  - id: D2
    title: Weight of capability-trajectory exposure in 0→1 mode
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "The User — PM searching for PMF in GenAI"
    stakeholders:
      - name: Hari (PM)
        factors: [how decisive wrapper-risk has been in real 0→1 GenAI calls]
      - name: Build
        factors: [second-heaviest weight proposed (.20) on the argument that model-absorption risk is the defining GenAI search question]
    options:
      - keep .20 (second-heaviest)
      - demote (~.10) — treat as one factor among peers
      - promote to a gate — top-box absorption risk vetoes regardless of score
    status: pending
    notes: >
      The "gate" option would be a fast-and-frugal-tree exit, not a weight — a
      structural change to the 0→1 scorer if chosen. LOUD FLAG (requested by
      Compliance and Sequencing): if the gate option wins, that is NOT a config
      change — it modifies engine-m0, requires a technical-spec (and possibly
      Spine) update FIRST, a new Compliance test group and matrix rows, and it
      must land before space-push, because real 0→1 logs must not accumulate
      against a scorer that is about to change shape. The other two options are
      one-line edits to configs/zero_to_one.yaml. GTM's tour is deliberately
      D2-invariant (0→1 screen shows banner + ceiling routing only, no numbers).
    on_resolution_notify:
      - engineering: "options 1–2: edit configs/zero_to_one.yaml only; gate option: engine-m0 change, blocks space-push"
      - compliance: >
          gate option requires new test group + matrix rows; raise spec update
          before any code moves. Additionally (covenant accepted round 3): ANY
          resolution that changes a shipped 0→1 weight — options 1–2 included,
          not just the gate — is flagged to compliance in the resolution note
          in the same round, since T-CFG-01 pins the shipped weight tables and
          fixtures must regenerate before any push on the new values.
      - sequencing: "gate option inserts an engineering node before space-push"
      - gtm: >
          same-round notification if any weight changes from the shipped
          defaults (covenant accepted round 2, same terms as D1). The tour is
          deliberately D2-invariant (0→1 screen shows banner + ceiling routing,
          no numbers), so the expected action on options 1–2 is a one-line
          confirmation that invariance still holds; the gate option requires
          re-checking the tour's 0→1 stop narration.

  - id: D3
    title: Does a portfolio/knapsack layer ever enter scope, and if so at what trigger?
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "Scope Boundaries — 'portfolio/knapsack automation (flagged, not decided)'"
    stakeholders:
      - name: Hari (PM)
        factors: [whether real allocation decisions stay pairwise in practice or force a budget-constrained ranking, appetite for v2 scope]
      - name: Build
        factors: [strict A-vs-B keeps the noise-cancellation guarantee clean, a knapsack layer would need transitive scores the pairwise model deliberately does not promise, log schema already stores everything a future layer would need]
    options:
      - never — remove the flag, make the refusal permanent in the Spine at next version bump
      - deferred with a stated trigger — enters scope only when M2 activates (≥ ~45 labeled outcomes), since portfolio optimization over uncalibrated scores would violate the overstated-confidence refusal
      - deferred indefinitely — keep the flag as-is, revisit only on user pull; no Leaf designs for it
    status: pending
    notes: >
      The Spine itself marks this "flagged, not decided" — the only Scope
      Boundaries item left explicitly open. No build work depends on it in v1;
      the decision governs whether Architecture/Engineering must keep the log
      and engine interfaces knapsack-ready or may optimize them for strict
      pairwise. Build proceeds as if option 3 (nothing designed for it).

  - id: D4
    title: Calibration-report cadence and the n threshold for the reliability curve
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "Success Metrics — 'ζ (transitivity) and Brier accumulate from decision 1' / honesty-by-construction"
    stakeholders:
      - name: Hari (PM)
        factors: [how often a working PM will actually open an audit view, tolerance for being nagged about their own noise]
      - name: Build
        factors: [spec says reliability curve 'when n permits' without defining n, binned reliability curves below ~30 decisions are themselves overconfident — an uncalibrated calibration report violates the Spine's core refusal]
    options:
      - passive only — audit view always available on demand, ζ and Brier live from decision 1, reliability curve unlocks at n ≥ 30 with bin counts shown; no push cadence
      - milestone cadence — audit summary surfaced on the verdict card at decisions 10, 25, 50 (aligned with the M1 activation moment), reliability curve at n ≥ 30
      - every-verdict footer — one-line ζ/Brier readout on every verdict card, full report on demand, curve at n ≥ 30
    status: pending
    notes: >
      The spec fixes WHAT accumulates (Brier from decision 1, ζ live, reliability
      curve 'when n permits') but not WHEN it is shown or what n permits the
      curve. Cross-leaf: Design owns the surface, Engineering owns the
      thresholds, both need one answer. Build proceeds on option 1 as the
      least-commitment default; thresholds are config, not code.
      Exchange-round status: Engineering shipped option-1 behavior (audit
      section always available in app.py; ζ/Brier from decision 1); the n≥30
      reliability-curve unlock is NOT yet a wired config constant — Engineering
      should add it as config before the curve itself is built. Design keeps the
      verdict card able to absorb a one-line ζ/Brier footer without redesign in
      case option 2 or 3 wins.

  - id: D5
    title: Cutover rule from shipped seed distributions to user-log statistics for z-scoring
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "Solution Direction — 'model-of-the-judge activates from the user's own log' / 'applies the PM's own policy'"
    stakeholders:
      - name: Hari (PM)
        factors: [whether early verdicts should be comparable to later ones, how confusing a silent shift in scoring basis is to a non-statistician]
      - name: Build
        factors: [spec says seed distributions ship 'until the log grows' with no rule, per-factor std from fewer than ~10 log entries is noisier than the seed it replaces, cutover changes every subsequent z-score and therefore parity-path raw units]
    options:
      - hard cutover per factor at n ≥ 10 logged values, noted once in the audit view
      - Bayesian blend — seed acts as a pseudo-sample (e.g. weight 10) that the log gradually swamps; no discontinuity, converges to pure-log
      - never cut over in v1 — seeds are the permanent z-basis, log stats shown in the audit view as a diagnostic only
    status: pending
    notes: >
      The spec commits to both endpoints (seeds at first, the user's log
      eventually) but not the transition. It is load-bearing: z-scores feed the
      score, the interval, AND the path-to-parity raw-unit conversion, so a
      discontinuous cutover can silently flip a near-tie verdict between
      sessions — the exact Tuesday-noise the product exists to remove. Build
      proceeds on option 2 (blend) as the only discontinuity-free default;
      the pseudo-sample weight is config, not code.
      Exchange-round status: what Engineering actually shipped in v1 is
      seeds-only (no discontinuity risk at all — a safe interim), with
      log_derived_stats + ModeConfig.with_updated_distributions implemented and
      tested but deliberately NOT wired into app.py. Note that helper is a HARD
      replacement, not a blend: if option 2 stands it must not be wired as-is —
      the blend (seed as pseudo-sample, default pseudo-weight 10, config) still
      needs implementing before any switchover ships. Wiring the hard helper
      would silently choose option 1.

  - id: D6
    title: Fragility-flag threshold — what counts as a "small plausible move" of one factor
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: "Success Metrics — 'the verdict is honest by construction' / spec §5.4 fragility flag"
    stakeholders:
      - name: Hari (PM)
        factors: [how twitchy the fragility warning should feel in real use — a flag that fires constantly gets ignored, one that never fires is decoration]
      - name: Build
        factors: [three leaves shipped three different thresholds in the same build round — a genuine cross-leaf disagreement, not a convention]
    options:
      - 0.75 z-units, one global constant (Engineering's shipped FRAGILITY_Z=0.75 in pairwisepm/engine.py — the code as built)
      - 0.5 z-units, one global constant (Compliance's provisional FRAGILITY_EPS_Z=0.5 in tests/test_engine_spec.md — fires more often, the more conservative honesty posture)
      - per-factor epsilon derived from each factor's scale bounds / anchor rungs (GTM's tour reasons in one-rung swings; Compliance explicitly allows engineering to re-derive per factor)
    status: pending
    notes: >
      The spec (§5.4) says "small plausible move" without a number, and the
      build round produced a real three-way divergence: engine code uses 0.75σ,
      the compliance test spec pins 0.5σ, the GTM tour narrates one-rung
      (~0.25-contribution) swings. This is exactly what the queue is for.
      Build-meanwhile default: the code as shipped, 0.75σ (Engineering's
      constant), because tests bind to code at integration and the flag is a
      warning, not a score input — no logged number changes with the threshold.
      Whichever option wins, the constant becomes config, Compliance regenerates
      every T-FRAG fixture, and GTM re-checks the tour's fragility narration.
    on_resolution_notify:
      - engineering: "move the chosen epsilon into config; keep FRAGILITY_Z as the default only"
      - compliance: >
          regenerate T-FRAG constants against the resolved epsilon (every
          T-FRAG fixture is built on FRAGILITY_Z = 0.75). Covenant (accepted
          round 3): a resolution choosing any epsilon other than 0.75σ carries
          this flag in the resolution note itself, same round, and fixtures
          regenerate before any push on the new value.
      - gtm: "align the tour's fragility narration (Stop 5) with the resolved rule"

  - id: D7
    title: Is R-8 (browser-side imputation void) release-gating pre-pilot-live, with R-9 (dark-theme MP-1 illegibility) riding as second priority?
    raised_at: 2026-08-30
    sla_expires_at: 2026-09-01
    spine_commitment: >
      Success metric #4 "The verdict is honest by construction" and the
      Scope-Boundaries refusal "A judge that overstates its confidence is worse
      than no judge" — a verdict computed from 12 silently-imputed factor
      scores the user never entered is a fabricated-input verdict.
    stakeholders:
      - name: Design
        factors: [browser-verified defect against an already-admitted commitment (states.md §6.4 delta (d), closed round 1 as "unfilled factors block computation with no defaulting", now shown void in gradio 6.26 — gr.Number(value=None) renders and submits literal 0), MP-1 "survive a squint" fails entirely in the served dark theme (R-9)]
      - name: Engineering
        factors: [fix owner; mechanism is their call (empty-string Textbox-backed inputs, sentinel, or a Gradio version/config rendering None as empty); minimal-complexity agenda weighs the mechanism choice]
      - name: Sequencing
        factors: [graph admission bar — R-8 matches the defect-not-new-scope class written for R-1/R-2 and costs zero elapsed time in parallel with the human-gated D1/D2 path, but critical-path admission is sequencing's to grant, not design's to assert]
      - name: Compliance
        factors: [the green 54-test suite is structurally blind to this bug class (tests pass handlers Python None directly); a fix without a serialization-level regression guard recreates the honor-system gap twice converted to enforced tests this build (T-VEND-01, T-CUST-01)]
      - name: GTM
        factors: [second stakeholder supporting release-gating for R-8 and pre-pilot priority for R-9 on distinct Spine lines — metric 1 (blank-to-verdict under 5 minutes) and metric 4 (honest by construction) both broken in the served UI, demo-path harms on the record — first paint shows pre-filled 0s with red invalid borders, Compare on an incomplete form fabricates a verdict from 12 never-entered scores, the demo script's 0→1 ceiling beat (step 6) would run against a fabricated baseline because the seed pair is 1toN-only (recorded round 5 on GTM's demand)]
    options:
      - release-gating as claimed — engineering fixes R-8 (behavioral acceptance — an untouched factor never reaches the handler as a value; Compare on an incomplete form renders str.partial.verdict_placeholder) plus R-9's one-line-per-block CSS pre-pilot-live, sequencing admits the node in parallel with G-D1D2, compliance registers a serialization-level regression guard
      - split priority — R-8's blocking fix plus regression guard gate pilot-live; R-9 and the placeholder-rendering polish land as an immediate fast-follow with a no-dark-theme-demo caution standing until then
      - not gating — R-8/R-9 join the post-Pilot backlog and the pilot proceeds on a documented known-defect caveat (requires a stakeholder to actually argue that a verdict fabricated from 12 unentered scores is pilotable; none has)
    status: resolved_uncontested
    notes: >
      Registered round 4 on design's demand, per the round-2 process: a claimed
      gate goes through this queue with a Spine line and named stakeholders,
      never attached to the critical path by the claimant. The contested
      question is NARROW — not "is R-8 a bug" (browser-reproduced, undisputed
      evidence in states.md §6.4/§6.5) but "does it gate pilot-live" — and it
      may not stay contested: if engineering accepts the fix on-record and
