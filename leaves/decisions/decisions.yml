  - id: D8
    title: Does the release claim Spine success metric #1 (blank-to-verdict under 5 minutes) on a 1→N-only measurement, and does anyone own measuring 0→1?
    raised_at: 2026-08-31
    sla_expires_at: 2026-09-02
    spine_commitment: >
      Success Metrics #1 — "A PM completes a full A-vs-B comparison, from blank
      questionnaire to verdict card, in under 5 minutes" — which names no mode,
      while the Spine's User section names both (0→1 search and 1→N
      allocation); read against the Scope-Boundaries refusal "a judge that
      overstates its confidence is worse than no judge."
    stakeholders:
      - name: Compliance
        factors:
          - "its own self-reported round-13 scope correction is what created this question: M-UX-02 splits into M-UX-02a (1→N, instrumented) and M-UX-02b (0→1, matrix wording 'NO instrument, NO scheduled sitting'), so F-17 can convert at most half of SC-06"
          - "total-traceability standard — the b-half's disposition should rest on a citable ruling, not on the absence of one"
      - name: GTM
        factors:
          - "owns claim-ledger row 4, the 1c-i witness template, and the recruitment ask"
          - "has already mode-scoped the claim (verified this seat's own read of launch-copy.md), so the WORDING half has converged and only the COVERAGE half is open"
          - "is the seat that would have to recruit a second fresh user, or ask the first one for a second leg"
      - name: Design
        factors:
          - "owns the instrument; §6.12/§6.13 fix ONE 1→N blank-to-verdict run, so an 0→1 leg needs a protocol and a branch text that do not exist today"
          - "refuses to mint a record before a witnessed run exists — which is exactly why silence on the 0→1 half cannot become evidence in either direction"
      - name: Hari (PM)
        factors:
          - "the only stakeholder who can supply a fresh user at all — option 2's cost is entirely his"
          - "option 1's cost is also his: shipping a headline Spine metric measured on half its stated user population"
      - name: Sequencing
        factors:
          - "owns the M-UX-02b node state; a node with no instrument and no scheduled sitting is the perpetually-imminent shape its own agenda forbids"
          - "the alternative label (permanently unmeasured) is a release posture, not a graph fact, so the graph should not be the thing that decides it"
    options:
      - >
        Ship the mode-named claim and close the b-half explicitly: SC-06
        converts for 1→N only (if the sitting converts at all), 0→1 carries
        "designed so, not yet timed" at release with NO further sitting
        scheduled, and M-UX-02b is recorded as a deliberate, owned
        non-measurement rather than an open node. This is the real
        do-nothing option — it is what happens by default if nobody rules —
        and choosing it explicitly costs nothing but names an owner for it.
        INSTRUMENT ON RULING (compliance's round-15 demand, accepted; this
        option is the one that most needs it): "no instrument, by decision,
        owner <named seat — Hari unless he delegates>, revisit on <event>",
        where the event is stated concretely rather than left to memory —
        the suggested trigger is the first 0→1 change that would move the
        number anyway (a 0→1 factor-set edit, a 0→1 questionnaire layout
        change, or the first pilot 0→1 log arriving). Option 1 without those
        three fields is not option 1; it is the omission this entry was
        raised against, wearing a resolution's clothes.
      - >
        Schedule a second witnessed sitting for 0→1 under the identical
        §6.12 protocol with a second fresh user, before the release audit;
        gtm owns recruitment, design extends §6.12/§6.13 with an 0→1 branch,
        compliance registers the instrument for M-UX-02b before the run.
        FUNDING DEPENDENCY, RECORDED 2026-08-31 AND VISIBLE ON THE OPTION
        ITSELF (gtm's round-15 demand — accepted in its second form, marked
        rather than struck; see notes for why the option is not deleted):
        **UNFUNDABLE FROM GTM.** gtm has answered on the record at
        launch-copy.md 1c-i item 10 that a second separately recruited FRESH
        user is not obtainable from that seat — it does not own the
        recruitment channel, and the FIRST fresh user has not materialised
        across rounds 10-15 with the witness standing by all day. This
        option is therefore HARI-FUNDED ONLY: choosing it commits the one
        stakeholder who can supply a fresh user, and choosing it without
        saying so would settle the 0→1 half by omission one level down,
        which is the exact defect this entry exists to prevent.
        INSTRUMENT ON RULING: an M-UX-02b sitting with a named date and
        witness, design's 0→1 §6.12/§6.13 leg, and compliance's registered
        M-UX-02b instrument, all three IN PLACE BEFORE the run — not after.
      - >
        Add an 0→1 leg to the SAME sitting, run after the 1→N leg and
        recorded as an explicitly NON-fresh-user secondary datum that does
        NOT convert M-UX-02b and does not touch the canonical phrase —
        labeled evidence where today there is none, at the cost of a few
        minutes of the recruited user's time and zero protocol relaxation.
        STATUS 2026-08-31: PRE-STAGED ON BOTH OWNING SEATS, so this option
        is decidable at the hour and costs no leaf-round if it wins — gtm
        pre-staged the ask at 1c-i item 10 (runs only AFTER the 1→N leg,
        abandoned if that run voids, number NOT sayable in any payload), and
        design pre-wrote the leg INACTIVE at §6.15(vi) with the
        disqualifier inside the record line ("user was NOT fresh … therefore
        this datum does NOT discharge M-UX-02b"), to be DELETED rather than
        left dormant if option 1 wins. INSTRUMENT ON RULING: design's
        §6.15(vi) record line plus compliance registering the datum's
        NON-converting status BEFORE the run; and, because the hazard here
        is quotation rather than measurement, gtm's standing bar on the
        number appearing in any payload is part of the instrument, not a
        courtesy.
    status: pending
    notes: >
      What this entry is NOT: it is not the M-UX-02 sitting. That sitting has
      always been schedule, not a decision, and this queue has said so through
      three conceded rounds — nothing here defers it, reopens it, or converts
      it into a D-entry. What is queued is the coverage question compliance's
      own round-13 correction created: both pre-registered instruments measure
      1→N, so whatever tomorrow's backstop produces, half of a Spine success
      metric ends the build unmeasured with no instrument, no scheduled
      sitting and no named owner. That half is currently being answered by
      omission, which is the one way a question gets settled here without
      anybody deciding it.
      Raised now rather than after the backstop because the answer is cheapest
      before the sitting (option 3 costs minutes if it is decided before the
      user is in the room, and is unavailable afterwards) and because a
      question raised after its own window has closed is a question already
      answered.
      BUILD-MEANWHILE DEFAULT: option 1 exactly as the board already has it —
      compliance's M-UX-02a/b split as written, gtm's mode-named row-4 claim,
      0→1 carrying the canonical phrase "designed so, not yet timed". No leaf
      changes anything, no branch text is rewritten, and no record is minted
      early on account of this entry.
      ROUND-16 · THE ONE PERISHABLE QUESTION IS ANSWERED, AND THE ANSWER
      NARROWS THE ENTRY WITHOUT CLOSING IT. This entry asked gtm, before the
      sitting rather than after, whether a second fresh user is obtainable.
      It is answered on their own record (1c-i item 10, read from this seat):
      NO from that seat, with the reason stated — gtm does not own the
      recruitment channel — and YES to the short 0→1 leg from the recruited
      user if one ever arrives. Both halves are now carried on the options
      themselves: option 2 is marked UNFUNDABLE FROM GTM / Hari-funded only,
      option 3 is marked pre-staged on both owning seats.
      WHY OPTION 2 IS MARKED AND NOT STRUCK (gtm asked for either; this seat
      takes the second and states the refusal openly rather than banking the
      easier edit). A seat's inability to fund an option is a COST, not a
      disqualification, and this entry's own stakeholder list already names
      Hari as the only person who can supply a fresh user — option 2's cost
      was his from the day it was written. Deleting it would let one seat's
      capacity retire a branch that belongs to a stakeholder who has not yet
      spoken, and "the option nobody could afford was quietly removed before
      the decider saw it" is the same failure as "the coverage half was
      settled by nobody having asked", one level down. Marked, it costs a
      reader four words and keeps the choice honest; struck, it saves nothing
      and pre-empts Hari. The marking is dated and cites gtm's own line, so
      if the recruitment situation changes the mark is falsifiable rather
      than permanent.
      EVERY RULING NAMES ITS INSTRUMENT (compliance's round-15 demand,
      accepted whole and generalised rather than granted once). Each option
      above now carries the instrument that would make its consequence
      checkable later, and option 1 — the one that changes nothing — carries
      the hardest version: "no instrument, by decision, owner <seat>, revisit
      on <event>", all three fields required. The demand's argument is this
      queue's own standard pointed at itself and it is adopted as a standing
      rule in the Leaf README (`resolution_instrument`, mandatory on any
      entry that closes), because a rule that only ever applied to D8 would
      itself be an instrument registered against one row.
      NON-DEFERRAL (self-applied, binding on this Leaf): D8 does NOT gate
      G-D1D2 and does NOT defer, pause or reopen the D1–D6 resolution round.
      The round-13 boundary named exactly one permitted deferral (a first-hour
      M-UX-02 sitting); an entry of this Leaf's own making does not get to
      become the second one. If D8 is still pending when the resolution round
      executes, the round executes anyway.
    on_resolution_notify:
      - compliance: >
          record the ruling on F-17/SC-06 as the basis for M-UX-02b's
          disposition, replacing the current no-instrument-no-sitting state
          with a cited one; if option 2 or 3 wins, register the 0→1
          instrument (and, for option 3, its explicit non-converting status)
          BEFORE the run, not after. Round 16: the ruling will arrive with a
          `resolution_instrument` field filled on whichever option wins,
          including option 1 — register THAT string in the row, so the
          b-half's state cites both the decision and the way anyone checks
          later that it held
      - gtm: >
          claim-ledger row 4 and 1c-i follow the ruling; option 2 or 3 puts a
          recruitment or same-sitting ask on this seat, and option 1 makes the
          permanent 0→1 fallback an owned release posture rather than a
          leftover
      - design: >
          option 2 or 3 requires an 0→1 protocol leg in §6.12 and its own
          pre-written branch text in §6.13; option 1 requires nothing
      - sequencing: >
          M-UX-02b's node state follows this ruling and nothing else. Encode
          the non-deferral clause above with the entry: D8 does not gate
          G-D1D2 and does not defer the D1–D6 resolution round

  - id: D9
    title: Does the M-UX-02a witness record carry a launch-environment VOIDING condition, and on which predicate?
    raised_at: 2026-08-31
    resolved_at: 2026-08-31
    sla_expires_at: 2026-09-02
    spine_commitment: >
      Success Metrics #1 (blank-to-verdict under 5 minutes) read against the
      Scope-Boundaries refusal "a judge that overstates its confidence is
      worse than no judge" — applied to the tool's own measurement. Whether a
      timed run counts as a record decides whether SC-06 converts, so the
      voiding rule is part of the claim, not housekeeping around it.
    stakeholders:
      - name: GTM
        factors:
          - "owns the 1c-i witness template; launch-copy.md item 6 currently lists 'the launch hazard at item 7' among the causes that make a run NO RECORD, and item 7 declares a launch-from-repo-root PRECONDITION binding every demo — the first new gate opened on this surface since round 8"
          - "item 7 carries its own deletion protocol (engineering's per-line notification that the install is editable or absent AND architecture's re-run), so this seat may retire the cwd clause on its own evidence — which is precisely the moment the residual question below gets answered by deletion rather than by ruling"
      - name: Design
        factors:
          - "owns the acceptance protocol; §6.14 adds a voiding condition on a DIFFERENT predicate — 'a run whose app was launched against a bound module that is not the authority's bytes is no record' — plus 'the sitting is launched from the repository root'"
          - "the bytes predicate survives the packaging fix that retires the cwd predicate; it is about which copy the browser was served, not about a directory"
      - name: Sequencing
        factors:
          - "owns the node's acceptance definition; work-items.yaml records the working directory as 'a recorded FIELD, never as a precondition the sitting must satisfy', on the stated ground that a blocking precondition bought with a disconfirmed premise lengthens the path for free"
          - "that refusal is on record against gtm's cwd clause; it was written without design's bytes clause in view, so it is not obvious the refusal reaches both"
      - name: Compliance
        factors:
          - "F-17's registered voiding list reads 'coaching beyond mode selection, non-fresh user' and nothing about launch (verified from this seat this round)"
          - "gtm's round-14 demand asks for the launch precondition to be registered INSIDE that list; granting it would settle the rule in the matrix while sequencing's refusal stands unrecorded in the same matrix"
          - "owns T-VEND-02/03/04, which make design's bytes/identity predicate checkable in one command instead of adjudicable after the fact"
      - name: Architecture
        factors:
          - "authored the finding the cwd clause was built on; sequencing has demanded it be narrowed, and this Leaf's own test agrees with sequencing on the mechanism (below)"
      - name: Engineering
        factors:
          - "made the install editable, which is what puts the cwd clause up for deletion; owns whether a pre-clock guard run is a trivial ask (it is one pytest invocation)"
    options:
      - >
        RECORD-ONLY (sequencing's position). Launch environment is a recorded
        field on the witness line and no launch-environment voiding condition
        exists. Residual risk sits with pre-push gate P-12 / T-VEND-02/03/04
        and with the fact that a mis-bound copy now fails loudly rather than
        silently. gtm deletes item 7's voiding clause; design's §6.14 clause
        is withdrawn to a note.
      - >
        VOID ON A CHECKED PREDICATE (design's condition made operational).
        Immediately before the clock starts, `pytest tests/test_vendoring.py`
        is run and its result recorded on the witness line; the run is void on
        this ground only if that check is red, or if the app fails to reach
        first paint. This keeps design's bytes predicate, drops the cwd proxy,
        and answers sequencing's objection — the condition is tested at the
        hour rather than argued after it. Cost: one command, before the clock.
      - >
        VOID ON CWD (gtm's clause as written). An off-root launch voids the
        run regardless of install state, kept as a presenter-facing rule
        because presenters do not inspect `direct_url.json`. Simplest to say,
        but it is now a proxy this Leaf has tested and found loose in both
        directions.
    status: resolved_uncontested
    notes: >
      WHAT IS NOT CONTESTED, so the entry is not mistaken for a defect report.
      Architecture's A-13-01 is a defect with a named owner and an executed
      fix. Verified from this seat this round with the project interpreter:
      from /tmp, `import pairwisepm.strings` binds
      /Users/brettleehary/mcparea/ProMgtAI/pairwisepm/strings.py with
      'str.empty.example_cta' present — the hazard item 7 was opened on is not
      reachable on this machine now. The disputed MECHANISM is also settled,
      and settled against the seat this Leaf would otherwise be quoting: a
      script launched from another directory gets sys.path[0] = the SCRIPT's
      directory (own run, printed), so `python /abs/path/app.py` puts the repo
      root first and sequencing's narrowing of the blast radius is correct.
      Neither of those is queued. What is queued is the RULE that outlives
      them.
      WHY IT IS A RULE AND NOT TRIVIA. Three files now carry three different
      dispositions of the same acceptance question, each written by the seat
      that owns a different half of the instrument: gtm's template voids on
      cwd, design's protocol voids on bound bytes, sequencing's graph refuses
      preconditions of that class outright. A voided run and a valid run are
      not the same event — one leaves SC-06 unconverted with a dated cause,
      the other converts it or flips it to measured-FAILED — so at the hour
      this resolves by whoever speaks first, or by whichever file the reader
      opened. The packaging fix retires gtm's predicate and does NOT retire
      design's, so the likely path is that the cwd clause is deleted on
      evidence and the bytes clause is left standing unexamined, with
      sequencing's refusal on record against a clause it was not aimed at.
      That is settlement by edit order, which is the one outcome this queue
      exists to prevent.
      BUILD-MEANWHILE DEFAULT, and it is the OPERATIVE RULE AT THE SITTING
      because the sitting may precede this SLA: the sitting is launched from
      the repository root and the directory is recorded beside theme and mode
      — every seat either requires that or permits it, so it is uncontested
      and costs nothing. While D9 is pending, no run is voided on a
      launch-environment ground unless the run actually failed to reach first
      paint or the vendoring guards were red at the hour. A rule still under
      dispute does not retroactively unmake a record.
      NON-DEFERRAL (self-applied, same terms as D8): D9 does NOT gate G-D1D2,
      does NOT defer, pause or reopen the D1–D6 resolution round, and — stated
      because it is the obvious way this entry could do harm — does NOT delay,
      block, re-schedule or add a precondition to the M-UX-02a sitting. The
      sitting proceeds under the default above whatever D9's status is.
      DISSOLUTION CLAUSE (D7's precedent, invoked deliberately): this entry
      may not need adjudicating. If the seats converge before the SLA — one
      predicate standing in gtm's template, design's §6.13/§6.14 list,
      sequencing's acceptance definition and compliance's F-17 row, each
      recorded from its own seat — D9 resolves `resolved_uncontested`,
      dissolved bilaterally, with no ruling and no ceremony. Held open for one
      round so the convergence is a convergence and not a deletion nobody
      noticed.
      ROUND-16 · THE DISSOLUTION CLAUSE FIRES, AND IT FIRES ON FOUR FILES
      READ FROM THIS SEAT, NOT ON FOUR PACKETS. The clause named the exact
      condition: one predicate standing in gtm's template, design's
      §6.13/§6.14 list, sequencing's acceptance definition and compliance's
      F-17 row, each recorded from its own seat. Checked here, in the files,
      2026-08-31 round 16:
      · gtm — launch-copy.md item 7: gate DELETED, the round-14 cwd mechanism
        RETRACTED in place (not narrowed), and design's condition adopted
        VERBATIM as what survives: "a run whose app was launched against a
        bound module that is not the design authority's bytes is NO RECORD."
        Item 6's voiding list carries the same predicate, and the witness
        template's field now reads "bound module = design authority's bytes".
      · design — states.md §6.14(iv)/§6.15(ii): the same predicate, unchanged
        by the mechanism correction because it never had the working
        directory as its predicate; the launch directory is explicitly
        demoted to "a disambiguating field for a voided run, not a
        precondition of a valid one."
      · compliance — traceability.md F-17(iii)/(iv) and new gate P-14: gtm's
        stated MECHANISM refused as false and design's formulation registered
        in its place, made machine-checkable by `pytest tests/test_vendoring.py`
        as a pre-flight whose RESULT is recorded on the witness line.
      · sequencing — work-items.yaml (F)/(iii) and graph.md: working
        directory is a recorded field and no launch-location gate is
        encoded; a voided run of any registered cause routes to WINDOW
        CLOSED with the cause named, minting no fourth node state.
      That is one predicate in four files, with the instrument named in two
      of them. The three-way split this entry was raised on is GONE, and it
      went the way the entry hoped rather than the way it feared: the cwd
      clause was retired by the seat that opened it, IN THE SAME EDIT that
      adopted the surviving predicate by name — so the deletion did not carry
      the bytes clause out with it, which was the specific harm this entry
      was opened to prevent. It also converged on the shape of option 2
      rather than option 1: the predicate is kept AND made checkable, which
      is the version sequencing's objection could accept, because the
      condition is now tested at the hour rather than adjudicated after it.
      ROUND-17 · HOW THE CONTEST NARROWED, RECORDED BECAUSE "THE CONTEST
      DISSOLVED" AND "A LEAF SETTLED IT" ARE DIFFERENT HISTORIES AND ONLY ONE
      OF THEM IS TRUE (compliance's round-16 demand, accepted whole). The
      compliance matrix did NOT pick a side in this entry and did not need to.
      It never registered gtm's clause as settled; it refused gtm's stated
      MECHANISM as false, re-derived the true one from its own seat, and
      registered design's predicate with gate P-14 as its instrument — which is
      this entry's option 2 arrived at from the instrument side rather than a
      ruling on the contest. The three-way split narrowed by RETRACTION, not by
      registration: gtm withdrew the cwd mechanism on gtm's own reproduction.
      So no seat's position was recorded over another's, and no leaf — this one
      included — adjudicated it. The distinction is load-bearing for anyone
