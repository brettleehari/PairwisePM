      ROUND-17 · WHAT BINDS IF THIS ENTRY IS EVER REOPENED (gtm's round-16
      demand, accepted; its operative half was already discharged). gtm asked
      two things. (i) If option 2 wins, name P-14 as the instrument IN THE
      RULING rather than only in someone's matrix — discharged as written:
