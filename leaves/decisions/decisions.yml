    resolution: >
      Option 2 in substance — VOID ON A CHECKED PREDICATE — reached by
      bilateral dissolution, RECORDED not ruled. The standing rule across
      every file that owns a piece of the instrument: a run whose app was
      launched against a bound module that is not the design authority's
      bytes produces NO RECORD; it routes to WINDOW CLOSED with its cause
      named, never to MEASURED-TARGET-MISSED and never to a FAIL. The
      predicate is checked, not argued: `pytest tests/test_vendoring.py`
      green on the machine that will run the app, before the clock starts,
      with the result recorded on the witness line (compliance's gate P-14,
      gtm's item-7 pre-flight). The working directory is a RECORDED FIELD
      beside theme and mode — never a precondition — which is sequencing's
      position honored in full, and no launch-location gate exists in any
      file. The cwd predicate (option 3) is retired by the seat that authored
      it, on that seat's own re-reproduction, with its overbroad mechanism
      claim retracted in place rather than narrowed.
    resolution_rationale: >
      Traced to Spine Success Metric #1 (blank-to-verdict under five minutes)
      read against the Scope-Boundaries refusal "a judge that overstates its
      confidence is worse than no judge", pointed at our own measurement:
      whether a timed run counts as a record decides whether SC-06 converts,
      so the voiding rule is part of the claim. Two Spine-traced properties
      decided this and neither is a preference. (1) The predicate must name
      the thing that actually threatens the claim. A record timed against a
      build serving copy this catalogue did not specify measures a different
      product — and, as design established, a crash standing in front of an
      overstatement is not a fix: had the KeyError been repaired before the
      copy was, the same launch would have painted a stale verdict line
      asserting an auto-recompute the build does not perform, with every test
      green. The bound-module predicate names that; a directory does not, and
      the directory proxy was tested from this seat and found loose in both
      directions (`python /abs/path/app.py` puts the SCRIPT's directory on
      sys.path[0]). (2) A voiding condition must be decidable at the hour by
      a machine, not adjudicated afterwards by whoever reads it — otherwise
      the rule that decides whether a Spine metric converts is itself
      untestable, which is the failure mode this whole build keeps finding in
      its own instruments. P-14 makes it one command. Evidence base: all four
      owning files read from this seat this round (see the round-16 block in
      notes), plus this Leaf's own independent test of the disputed
      mechanism. No stakeholder's position was overruled — gtm retired its
      own clause on its own evidence while adopting the survivor by name,
      sequencing's refusal of a cwd precondition is satisfied exactly as
      written, design's predicate stands unchanged, compliance registered it
      with an instrument. There is nothing here to override, which is why
      this closes `resolved_uncontested` and carries no override window.
    resolution_instrument: >
      `pytest tests/test_vendoring.py` (T-VEND-01..06), run pre-flight on the
      sitting machine and its RESULT recorded in gtm's 1c-i witness line
      beside theme, mode and working directory — registered as compliance's
      pre-push/pre-sitting gate P-14 and as gtm's item-7 pre-flight. Anyone
      auditing later can check the ruling held by reading one field on the
      witness record; a sitting whose record lacks it is a record whose
      voiding condition was never checked.
      WHICH CLAUSES DECIDE THE VOID (round-17 narrowing, stated in the
      instrument because that is where it will be read): the command is the
      whole file, the D9 voiding ground is T-VEND-01/02/05 — the bound-copy
      clauses, T-VEND-05 never skipping and asserting both R-10 facts on the
      bound module by value. A red on T-VEND-03/04/06 is a genuine defect and
      blocks a push, but is NOT a D9 void; after the D1/D2 write T-VEND-06 is
      EXPECTED to red until the install is refreshed, and a re-opened sitting
      falls after that write. T-VEND-07 (round 17) is what makes a green here
      mean assertions ran at all — it is the floor under the instrument, not a
      voiding clause: green = exit 0 AND 0 skipped, skip count recorded beside
      the result on the witness line.
      ROUND-17 RESIDUE UPDATE — both items CLOSED, verified in the owning files
      from this seat rather than accepted from a packet, and recorded because
      residue reported once and never re-checked is how a closed item keeps
      being cited as open: (a) sequencing's gate list now names P-14 in a single
      stated list (`P-5 · P-6 · P-10 · P-11 · P-12 · P-13 · P-14`, graph.md, with
      P-14 labelled the only pre-clock precondition on the sitting); (b) design's
      §6.13 per-check line now names the check for its own §6.14 predicate
      (states.md — "before the sitting, from any directory, run
      `pytest tests/test_vendoring.py`", with the result a recorded field). No
      non-instrumented residue remains on this entry. The third item — pytest
      exits 0 on an all-skipped file, so a P-14 green was satisfiable by a run
      that asserted nothing — is ALSO closed, and closed better than the caveat
      sequencing asked for: compliance registered T-VEND-07 this round, which
      reads this file's own AST and reds unless T-VEND-04 and T-VEND-05 carry no
      skip predicate and every skipping clause skips on a predicate naming its
      own subject. Read from this seat in the source, not taken from a packet.
      That matters to THIS entry specifically: `resolution_instrument` below
      names P-14, so a P-14 green that could hide zero assertions would have
      been this Leaf's own ruling resting on an instrument that can report a
      success it never measured. It cannot now. Own run: 7 passed, 0 skipped.
      ROUND-18 · TWO SCOPE FACTS ABOUT THIS RULING'S OWN CLAUSE LIST — ONE
      ACCEPTED FROM ANOTHER SEAT, ONE HANDED TO A NEW ENTRY RATHER THAN
      SETTLED HERE.
      (i) ACCEPTED, and it is a correction to this ruling made by the seat
      that has to read it at the hour. gtm answered the round-17 narrowing in
      their own file rather than transcribing it: launch-copy.md's 1c-i line
      now reads the voiding set as T-VEND-01/02/03/05, adding T-VEND-03 and
      flagging the change openly as theirs instead of slipping it in. The
      addition is right, and for this entry's own stated reason rather than
      for convenience: the ruled PREDICATE names the design authority's bytes,
      but the property that makes a void a void is written one line further
      down in `resolution_rationale` — a record timed against a build serving
      something this board did not specify measures a DIFFERENT PRODUCT. A run
      whose engine resolved some other `configs/` tree is exactly that, and
      T-VEND-03 is the only clause that names it. The D9 voiding set is
      therefore T-VEND-01/02/03/05. Unchanged: T-VEND-04/06 remain real
      defects that block a push and are NOT voiding grounds, and the
      expected T-VEND-06 red after the D1/D2 write is still not a void.
      (ii) NOT settled here, because it is a live disagreement and not a
      residue. THREE of those four clauses can SKIP: T-VEND-01/02 where
      `leaves/design/strings.py` is absent, T-VEND-03 where `<root>/configs`
      is. On a tree carrying no design leaf this ruling's voiding set
      collapses to T-VEND-05 alone — which design's §6.13 pre-flight box
      already says in so many words ("T-VEND-02 is welcome when it runs and
      is not required, because it skips on a stripped tree"), while gtm's
      template and compliance's P-14 row say a skip is not a green at all.
      Reproduced from this seat this round in a scratch sdist-shaped tree
      (package and configs symlinked, `tests/test_vendoring.py` copied, no
      repo file mutated, project interpreter): **exit code 0, 5 passed, 2
      skipped**, with T-VEND-05 asserting. So the same command, on a tree
      this project actually ships, hands the presenter a result that two
      owning files call NO RECORD and a third calls fine. That divergence was
      created AFTER this entry closed, by the round-17 skip-aware clause, and
      it is raised as **D10** rather than answered inside a resolved entry.
      D9 is untouched by it: predicate, command and voiding set all stand
      whatever D10 rules.

  - id: D10
    title: Does a SKIP in the P-14 pre-flight make the run NO RECORD, or is the floor a named clause set rather than a skip count?
    raised_at: 2026-08-31
    sla_expires_at: 2026-09-02
    spine_commitment: >
      Success Metrics #1 (blank-to-verdict under five minutes) read against
      the Scope-Boundaries refusal "a judge that overstates its confidence is
      worse than no judge", pointed at our own measurement — the same trace as
      D9, one notch further in. D9 settled WHICH PREDICATE voids a witnessed
      sitting. It did not settle WHAT COUNTS AS THE INSTRUMENT ANSWERING, and
      whether a run counts as a record still decides whether SC-06 converts.
    stakeholders:
      - name: Compliance
        factors:
          - "owns the P-14 row and authored the operative form: green means exit code 0 AND `0 skipped`, with the skip count recorded beside the result"
          - "stated the consequence in the row itself and ruled on it there — if the presenter's tree lacks `leaves/`, the two design-authority clauses skip and P-14 is NOT green, and the row says in terms that this is 'the intended answer, not a defect'"
          - "also owns T-VEND-07, which makes the floor structural — T-VEND-04/05 can never acquire a skip predicate — and that guard is an argument for reading the floor as a clause set rather than as a count"
      - name: Design
        factors:
          - "owns the §6.13/§6.14 acceptance protocol and its pre-flight box, which says the opposite in so many words: run it 'from any directory', 'the governing clause is T-VEND-05; T-VEND-02 is welcome when it runs and is not required, because it skips on a stripped tree'"
          - "framed the arrangement as 'one command, three instruments, no third procedure invented here' — which is what makes the divergence load-bearing rather than academic, since the three instruments now read one result differently"
      - name: GTM
        factors:
          - "owns the 1c-i witness template and the presenter-facing voiding list; adopted compliance's reading in round 18 ('a run in which any vendoring guard skipped is not a green P-14 — it is a machine this seat does not recognise')"
          - "is the seat that would have to write NO RECORD on the line at the hour, and the seat whose own standard is that a voiding condition must be executable by the witness at that hour rather than argued afterwards"
      - name: Sequencing
        factors:
          - "owns the M-UX-02a acceptance definition, records P-14 as the ONLY pre-clock precondition on the sitting, and encodes no launch-location gate in any file"
          - "the `0 skipped` reading makes the presenter's TREE SHAPE a precondition of the sitting by a side door — a launch-environment precondition of the class this seat refused on record, arriving through the instrument rather than through a clause"
      - name: Decisions
        factors:
          - "D9's ruled voiding set is T-VEND-01/02/03/05 and three of those four can skip, so this entry's answer decides what this Leaf's own closed ruling reports on a stripped tree"
      - name: Hari (PM)
        factors:
          - "the sitting is his to convene and his record to lose; a sitting voided on a tree-shape technicality and a sitting waved through on a pre-flight that asserted less than the board believes are both his cost"
    options:
      - >
        ANY SKIP IS NOT GREEN — compliance's row and gtm's template as they
        stand today. P-14 green = exit 0 AND `0 skipped`; any skip at the hour
        means the sitting does not start until it is explained, and an
        unexplained skip routes the run to NO RECORD. Consequence stated
        rather than left implicit: this registers a TREE-SHAPE PRECONDITION on
        the sitting (the machine must carry `leaves/`, i.e. be a repo
        checkout), which is a launch-environment precondition of the class
        sequencing refused and D9 retired — so choosing it means choosing to
        re-admit that class knowingly, on the ground that the sitting should
        be timed against the build the matrix describes. INSTRUMENT ON
        RULING: design's §6.13 box amends to drop "from any directory" and the
        "T-VEND-02 is not required" sentence, so the three instruments read
        one result the same way; the P-14 field's two-token form already
        records what is needed.
      - >
        FLOOR IS A NAMED CLAUSE SET, NOT A COUNT — design's reading made
        general. P-14 is green when exit code is 0, the unskippable floor
        asserted (T-VEND-04/05, which T-VEND-07 guarantees can never skip),
        and every other clause either asserted or skipped on a predicate
        naming its OWN absent subject. A skip that says "this tree has no
        design leaf" is an honest report about the tree, not a failure of the
        check, and it does not void; a RED in the D9 voiding set does. This
        keeps the pre-flight portable to any tree the app can actually be
        launched from, which is what design's box already promises and what
        the wheel/sdist packaging makes concrete. INSTRUMENT ON RULING: the
        skip count stays a recorded witness field; the voiding read becomes
        the named clause list already written into D9's `resolution_instrument`
        and into gtm's item 6, and compliance's P-14 row states the floor as
        clauses rather than as a number.
      - >
        SKIP IS RECORDED, NEVER VOIDING — the sequencing-shaped option, stated
        here so it has an advocate rather than being the one nobody wrote
        down. The skip count is a recorded field exactly like the working
        directory, and no skip in this file ever voids a record; the only
        P-14 voiding ground is a RED in the D9 set. Strongest protection
        against losing a sitting to a tree-shape accident, and the weakest
        against a presenter's machine that quietly asserted less than the
        board thinks it did. INSTRUMENT ON RULING: the recorded skip count
        plus T-VEND-07, which is what makes an all-skipped green structurally
        unreachable and therefore makes this option survivable at all — it
        would not have been before round 17.
    status: pending
    notes: >
      WHAT IS NOT CONTESTED, so this is not mistaken for a defect report and
      nobody's round-17 work is being re-opened. The guards are right.
      T-VEND-07 is right and is the reason option 3 is even sayable. D9's
      predicate, command and voiding set are settled and this entry does not
      touch them. The skip count belongs on the witness line — all three
      seats agree, and it is already there. NONE of that is queued.
      WHAT IS CONTESTED is one sentence: what a SKIP in that file means at
      the hour. Three files, three answers, each written by the seat that owns
      a different third of the same instrument, and none of the three cites
      either of the others.
      · compliance, traceability.md P-14 row — "green means exit 0 AND `0
        skipped`", and, on the stripped-tree case, "P-14 is NOT green under
        this reading. That is the intended answer, not a defect."
      · design, states.md §6.13 pre-flight box — "from any directory ... The
        governing clause is T-VEND-05; T-VEND-02 is welcome when it runs and
        is not required, because it skips on a stripped tree."
      · gtm, launch-copy.md 1c-i — "a run in which any vendoring guard
        skipped is not a green P-14 ... the honest act at the hour is to
        write that on the line, not to record a pass", and item 6 turns a
        non-green P-14 into NO RECORD.
      REPRODUCED FROM THIS SEAT RATHER THAN ARGUED, because an entry raised on
      three quotations and no run would be the honor system with citations.
      Scratch sdist-shaped tree built in the scratchpad — `pairwisepm/` and
      `configs/` symlinked, `tests/test_vendoring.py` copied, NO repo file
      mutated, project interpreter: `5 passed, 2 skipped`, EXIT CODE 0, the
      two skips being T-VEND-01/02 on "stripped deployment: design leaf not
      present", with T-VEND-05 asserting. Repo checkout for contrast, same
      interpreter: 7 passed, 0 skipped; full suite 73 passed. The tree is not
      hypothetical — `pyproject.toml`'s sdist `include` ships `pairwisepm`,
      `configs` and `tests` and NOT `leaves`, so an unpacked sdist is exactly
      that shape, while the wheel ships no `tests` at all and cannot run the
      pre-flight in the first place.
      WHY THIS IS A RULE AND NOT TRIVIA, on this Leaf's own standing test. The
      probability of reaching it tomorrow is LOW and that is said plainly: the
      scheduled sitting runs from a repo checkout, where all seven clauses run
      and all three readings agree. But the same was true of D9 — the launch
      hazard it was raised on was already unreachable on this machine, and
      what was queued was the rule that outlived it. What makes this an entry
      is not the odds, it is the shape: a voided run and a valid run are
      different events (one leaves SC-06 unconverted with a dated cause, the
      other converts it), the answer currently depends on WHICH FILE THE
      READER OPENED, and one seat closed it inside its own row by writing
      that the consequence is intended. That is settlement by edit order,
      reaching the board through the very instrument D9 installed to prevent
      settlement by edit order.
      WHY IT IS NOT A REOPENING OF D9, stated because that is the obvious
      objection and it deserves an answer rather than a denial. D9 closed
      `resolved_uncontested` on 2026-08-31 and stays closed. Its question was
      WHICH PREDICATE voids; this one is WHAT THE INSTRUMENT'S OUTPUT MEANS,
      and it did not exist when D9 closed — compliance's skip-aware clause
      landed in round 17, after the close, and design's "not required"
      sentence was written for a different purpose in round 17 as well.
      Re-opening a resolved entry to absorb a question raised after it would
      make the close mean less, not more.
      NOBODY'S POSITION SHOULD BE DELETED TO END THIS. All three readings are
      defensible and each was written for a good reason — compliance's guards
      a false green, design's keeps the pre-flight portable, gtm's keeps the
      witness from having to judge. The failure mode this entry is watching
      for is not that the wrong one wins; it is that two of them quietly
      disappear in a tidy-up before anyone notices they disagreed. A seat that
      wants to change its own reading should say so and why; a seat that
      deletes its reading to make the contest go away has settled it.
      BUILD-MEANWHILE DEFAULT, and it is the OPERATIVE RULE AT THE SITTING
      because the sitting may precede this SLA. The sitting is run from the
      repository root of a repo checkout — where every reading agrees, the
      pre-flight reads `7 passed, 0 skipped`, and this entry costs nothing.
      P-14's result is recorded in gtm's two-token form exactly as the
      template already says. While D10 is pending, NO run is voided on a SKIP
      ground: the voiding grounds are unchanged from D9 — a RED in
      T-VEND-01/02/03/05, or the app failing to reach first paint. T-VEND-05
      cannot skip, so the default is not a loophole; it is the reading every
      seat can live with for one day.
      NON-DEFERRAL (self-applied, same terms as D8 and D9, and it matters more
      here than on either of them because this entry touches the sitting's own
      pre-flight): D10 does NOT gate G-D1D2, does NOT defer, pause or reopen
      the D1-D6 resolution round, and does NOT delay, block, re-schedule, void
      or add any precondition to the M-UX-02a sitting. The sitting proceeds
      under the default above whatever D10's status is. An entry raised to
      stop a rule from being settled by accident must not become the reason
      the thing it governs never happens.
      ROUND-19 STATUS — TWO OF THE THREE FILES HAVE MARKED AND NOBODY'S
      SENTENCE WAS DELETED, which is the outcome this entry was built to make
      possible and deserves recording as precisely as the divergence was. Read
      from the files at 21:08 local, not from packets.
