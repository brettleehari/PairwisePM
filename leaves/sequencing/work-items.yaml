# Sequencing Leaf — PairwisePM work-item graph
# The team self-routes from this file. Every node maps to a Spine commitment
# (Traceability Anchor); anything that doesn't is scope creep or a missing
# Spine update. Where this file and spine/SPINE.md conflict, the Spine wins.
#
# graph semantics:
#   edges.blocks  — hard dependency: the target CANNOT start/finish until the
#                   source is done. Absence of a blocks-edge means parallel is fine.
#   edges.informs — soft dependency: the target should read the source's output
#                   and may need rework if the source changes, but may proceed.
#
# status legend:
#   done          — completed IN THIS BUILD RUN (build-run-2026-08-30). Every
#                   done node also carries completed_in for audit.
#   ready         — all blocking predecessors done; can start now.
#   blocked       — at least one blocking predecessor not done (listed).
#   future        — gated by a numeric threshold or a later slice; not actionable yet.
#
# slices (delivery increments, cumulative):
#   MVP1  — local engine + Gradio UI + tests green; runs offline, pip-installable
#           from the repo. (Spine: "runs entirely offline after download")
#   Pilot — Hugging Face Gradio Space live; Hari + pilot PMs log real decisions.
#   GA    — pip release on PyPI + calibration report from real use (Brier, ζ,
#           reliability curve); M1 active from the user's own log.
#
# disciplines match the leaf keys: architecture | engineering | design | gtm |
# compliance | decisions | sequencing, plus `human` for Hari-only actions.
#
# effort is in person-days (pd) for humans; build-run nodes carry the estimate
# they were budgeted at, for the record.

