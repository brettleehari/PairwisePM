      ── RIDER, r16: "YAML-ONLY" NAMES A FILE, NOT AN EDIT CLASS — TWO
      CLASSES LIVE IN configs/*.yaml (design's demand, accepted; NON-GATING,
      defers nothing, moves no node, and does not touch the
      backstop-collision ordering above). Five seats have read engineering's
