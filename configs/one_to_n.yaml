# PairwisePM factor schema — 1→N (allocation) mode.
# Derives from docs/technical-spec.md §2. Priors are a stated, editable policy,
# not fitted values (pending Decisions Leaf sign-off, D1). Edit weights here, not in code.
#
# Field meanings:
#   prior_weight   magnitude of the prior weight (D1 default from spec §2)
#   sign           +1 or -1; effective weight = sign * prior_weight
#   tag            lever (changeable by working) | fact (it is what it is)
#   seed_mean/std  seed z-scoring distribution, used until the user's own log grows;
#                  stated in TRANSFORM space when transform != identity
#   transform      identity | log10p  (log10(1+x), for heavy-tailed raw counts)
#   plausible_range  raw-unit bounds used for path-to-parity feasibility checks

mode: one_to_n
label: "1→N (allocation)"
banner: null

factors:
  - key: impact_primary_metric
    name: "Impact on primary metric"
    scale: "vs. a named past feature, −2..+2"
    prior_weight: 0.25
    sign: 1
    tag: lever
    rationale: "Anchoring to a named shipped feature replaces a soft 1–10 guess with a comparative judgment PMs are actually good at."
    seed_mean: 0.0
    seed_std: 1.0
    transform: identity
    plausible_range: [-2, 2]

  - key: capability_feasibility
    name: "Capability feasibility"
    scale: "eval / prototype pass rate, 0–4"
    prior_weight: 0.20
    sign: 1
    tag: lever
    rationale: "GenAI features fail on model capability more than on engineering; a measured pass rate beats optimism."
    seed_mean: 2.0
    seed_std: 1.0
    transform: identity
    plausible_range: [0, 4]

  - key: reach
    name: "Reach"
    scale: "users affected per quarter (count)"
    prior_weight: 0.15
    sign: 1
    tag: fact
    rationale: "Reach is an observable property of the user base, not a hope — hence a fact. Seed distribution matches the canonical demo (leaves/gtm/seed-comparison.json); switch transform to log10p for heavy-tailed user bases."
    seed_mean: 5000
    seed_std: 3000
    transform: identity
    plausible_range: [0, 10000000]

  - key: unit_economics
    name: "Unit economics"
    scale: "value per use vs. inference cost, 0–4"
    prior_weight: 0.15
    sign: 1
    tag: lever
    rationale: "Inference cost per use is the silent killer of GenAI features; margin per use must be scored, not assumed."
    seed_mean: 2.0
    seed_std: 1.0
    transform: identity
    plausible_range: [0, 4]

  - key: data_flywheel
    name: "Data flywheel"
    scale: "usage → data → better feature, 0–4"
    prior_weight: 0.10
    sign: 1
    tag: fact
    rationale: "A compounding data loop is structural to the idea; you either have the loop or you don't."
    seed_mean: 1.5
    seed_std: 1.0
    transform: identity
    plausible_range: [0, 4]

  - key: risk_surface
    name: "Risk surface"
    scale: "hallucination / compliance exposure, 0–4 REVERSED (4 = lowest exposure)"
    prior_weight: 0.05
    sign: 1
    tag: lever
    rationale: "Guardrails, review flows and scoping can shrink exposure — risk is workable, hence a lever."
    seed_mean: 2.0
    seed_std: 1.0
    transform: identity
    plausible_range: [0, 4]

  - key: effort
    name: "Effort"
    scale: "person-weeks, reference-class adjusted"
    prior_weight: 0.10
    sign: -1
    tag: lever
    rationale: "Cost side of the ledger; reference-class adjustment fights the planning fallacy before the number enters the score."
    seed_mean: 8.0
    seed_std: 4.0
    transform: identity
    plausible_range: [0.5, 52]

# Captured and displayed, NEVER entered into the mechanical score (Spine scope boundary).
evaluative_inputs:
  - key: strategic_fit
    name: "Strategic fit"
    scale: "0–4"
    note: "not scored — labeled override input"
  - key: brand_fit
    name: "Brand fit"
    scale: "0–4"
    note: "not scored — labeled override input"

flags: []
